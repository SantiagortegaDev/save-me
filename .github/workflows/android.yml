name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

# New pushes cancel an older build of the same branch, but never a release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: ${{ !inputs.release_tag }}

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the release notes.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Generates android/ from app.json (Continuous Native Generation).
      - run: npx expo prebuild --platform android --no-install
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/SaveMe-${VERSION}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SaveMe-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          # Commit subjects since the previous release; the app shows these in its update dialog.
          CURRENT="${{ inputs.release_tag || github.ref_name }}"
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$CURRENT" | head -n 1)
          RANGE=${PREV:+$PREV..}HEAD
          { echo "## What's new"; git log "$RANGE" --no-merges --pretty='- %s' | grep -vE '^- Release [0-9]' || true; } > dist/notes.md
          cat dist/notes.md
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # From a manual run this creates the tag on the built commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: SaveMe ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.apk
          body_path: dist/notes.md
          generate_release_notes: true
